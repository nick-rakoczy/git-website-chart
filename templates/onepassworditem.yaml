{{- if .Values.gitCredentials.onePassword.enabled }}
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "static-site.gitSecretName" . }}
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
  {{- with .Values.gitCredentials.onePassword.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  itemPath: {{ required "gitCredentials.onePassword.itemPath is required when OnePasswordItem provisioning is enabled" .Values.gitCredentials.onePassword.itemPath | quote }}
{{- end }}
