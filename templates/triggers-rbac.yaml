{{- if and .Values.triggers.enabled .Values.triggers.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "static-site.triggersServiceAccountName" . }}
  namespace: {{ include "static-site.triggersNamespace" . }}
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
  {{- with .Values.triggers.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "static-site.triggersRoleName" . }}-secrets
  namespace: {{ include "static-site.triggersNamespace" . }}
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - triggers.tekton.dev
    resources:
      - eventlisteners
      - interceptors
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    resourceNames:
      - {{ include "static-site.triggersServiceAccountName" . }}
    verbs:
      - impersonate
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ .Values.triggers.github.webhookSecret.name }}
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "static-site.triggersRoleName" . }}-secrets
  namespace: {{ include "static-site.triggersNamespace" . }}
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "static-site.triggersRoleName" . }}-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "static-site.triggersServiceAccountName" . }}
    namespace: {{ include "static-site.triggersNamespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "static-site.triggersRoleName" . }}-interceptors
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - triggers.tekton.dev
    resources:
      - clusterinterceptors
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "static-site.triggersRoleName" . }}-interceptors
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "static-site.triggersRoleName" . }}-interceptors
subjects:
  - kind: ServiceAccount
    name: {{ include "static-site.triggersServiceAccountName" . }}
    namespace: {{ include "static-site.triggersNamespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "static-site.triggersRoleName" . }}-submit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - tekton.dev
    resources:
      - pipelineruns
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "static-site.triggersRoleName" . }}-submit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "static-site.triggersRoleName" . }}-submit
subjects:
  - kind: ServiceAccount
    name: {{ include "static-site.triggersServiceAccountName" . }}
    namespace: {{ include "static-site.triggersNamespace" . }}
{{- end }}
