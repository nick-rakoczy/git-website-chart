{{- if .Values.pipeline.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "static-site.pipelineServiceAccountName" . }}
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
  {{- with .Values.pipeline.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
