apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "static-site.fullname" . }}
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "static-site.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "static-site.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: git-sync
          image: "{{ .Values.git.image.repository }}:{{ .Values.git.image.tag }}"
          imagePullPolicy: {{ .Values.git.image.pullPolicy }}
          args:
            - {{ printf "--repo=%s" .Values.site.repository | quote }}
            - {{ printf "--ref=%s" .Values.site.revision | quote }}
            - --root=/workspace
            - --link=source
            - --one-time=true
            - --depth={{ .Values.git.depth }}
            - --submodules={{ ternary "off" "recursive" .Values.git.disableSubmodules }}
            - --git-gc=off
            {{- if eq .Values.gitCredentials.authentication "ssh" }}
            - --ssh-key-file=/etc/git-secret/ssh
            - --ssh-known-hosts=true
            - --ssh-known-hosts-file=/etc/git-secret/known_hosts
            {{- else if eq .Values.gitCredentials.authentication "githubApp" }}
            - --github-app-private-key-file=/etc/git-secret/private-key.pem
            {{- end }}
          {{- if eq .Values.gitCredentials.authentication "githubApp" }}
          env:
            - name: GITSYNC_GITHUB_APP_APPLICATION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "static-site.gitSecretName" . }}
                  key: {{ .Values.gitCredentials.githubApp.applicationIdKey }}
            - name: GITSYNC_GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "static-site.gitSecretName" . }}
                  key: {{ .Values.gitCredentials.githubApp.installationIdKey }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.git.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.git.resources | nindent 12 }}
          volumeMounts:
            - name: source
              mountPath: /workspace
            - name: git-sync-tmp
              mountPath: /tmp
            - name: git-credentials
              mountPath: /etc/git-secret
              readOnly: true
        {{- if .Values.build }}
        - name: prepare-site
          image: "{{ .Values.publishImage.repository }}:{{ .Values.publishImage.tag }}"
          imagePullPolicy: {{ .Values.publishImage.pullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - rm -rf /site/* /site/.[!.]* /site/..?* 2>/dev/null || true
          volumeMounts:
            - name: site
              mountPath: /site
        {{- range $index, $stage := .Values.build }}
        - name: build-{{ $index }}
          image: "{{ $stage.image.repository }}:{{ $stage.image.tag }}"
          imagePullPolicy: {{ $stage.image.pullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - |
              set -eu
              stage_name={{ $stage.name | quote }}
              working_directory={{ $stage.workingDirectory | quote }}
              output_directory={{ $stage.outputDirectory | quote }}
              publish_path={{ $stage.path | quote }}
              for relative_path in "$working_directory" "$output_directory" "$publish_path"; do
                case "$relative_path" in
                  ""|/*|..|*/..|../*|*/../*) echo "invalid path in build stage $stage_name: $relative_path" >&2; exit 1 ;;
                esac
              done
              build_root="/workspace/build-{{ $index }}"
              rm -rf "$build_root"
              mkdir -p "$build_root"
              cp -R /workspace/source/. "$build_root/"
              cd "$build_root/$working_directory"
              /bin/sh -ec {{ $stage.command | quote }}
              output_path="$build_root/$working_directory/$output_directory"
              test -d "$output_path"
              mkdir -p "/site/$publish_path"
              cp -R "$output_path/." "/site/$publish_path/"
          volumeMounts:
            - name: source
              mountPath: /workspace
            - name: site
              mountPath: /site
          {{- with $stage.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $stage.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- else }}
        - name: publish-source
          image: "{{ .Values.publishImage.repository }}:{{ .Values.publishImage.tag }}"
          imagePullPolicy: {{ .Values.publishImage.pullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - |
              set -eu
              rm -rf /site/* /site/.[!.]* /site/..?* 2>/dev/null || true
              cp -R /workspace/source/. /site/
              rm -rf /site/.git
          volumeMounts:
            - name: source
              mountPath: /workspace
              readOnly: true
            - name: site
              mountPath: /site
        {{- end }}
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.nginx.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.nginx.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /{{ .Values.site.indexFile }}
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          volumeMounts:
            - name: site
              mountPath: /srv/site
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: site
          emptyDir: {}
        - name: source
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
        - name: git-sync-tmp
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: {{ include "static-site.nginxConfigName" . }}
        - name: git-credentials
          secret:
            secretName: {{ include "static-site.gitSecretName" . }}
            defaultMode: 0440
            items:
              {{- if eq .Values.gitCredentials.authentication "ssh" }}
              - key: {{ .Values.gitCredentials.privateKeyKey }}
                path: ssh
              - key: {{ .Values.gitCredentials.knownHostsKey }}
                path: known_hosts
              {{- else if eq .Values.gitCredentials.authentication "githubApp" }}
              - key: {{ .Values.gitCredentials.githubApp.privateKeyKey }}
                path: private-key.pem
              {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
