{{- if and .Values.events.enabled .Values.events.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "static-site.eventsServiceAccountName" . }}
  namespace: {{ include "static-site.eventsNamespace" . }}
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
  {{- with .Values.events.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "static-site.eventsSecretsRoleName" . }}
  namespace: {{ include "static-site.eventsNamespace" . }}
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ .Values.events.github.webhookSecret.name }}
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "static-site.eventsSecretsRoleName" . }}
  namespace: {{ include "static-site.eventsNamespace" . }}
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "static-site.eventsSecretsRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "static-site.eventsServiceAccountName" . }}
    namespace: {{ include "static-site.eventsNamespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "static-site.eventsSubmitRoleName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - workflows
    verbs:
      - create
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "static-site.eventsSubmitRoleName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "static-site.eventsSubmitRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "static-site.eventsServiceAccountName" . }}
    namespace: {{ include "static-site.eventsNamespace" . }}
{{- end }}
