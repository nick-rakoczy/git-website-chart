{{- if and .Values.triggers.enabled .Values.triggers.github.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "static-site.eventListenerName" . }}
  namespace: {{ include "static-site.triggersNamespace" . }}
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
  {{- with .Values.triggers.github.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.triggers.github.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "triggers.github.ingress.hostname is required when the GitHub trigger ingress is enabled" .Values.triggers.github.ingress.hostname }}
      http:
        paths:
          - path: {{ .Values.triggers.github.endpoint }}
            pathType: {{ .Values.triggers.github.ingress.pathType }}
            backend:
              service:
                name: {{ include "static-site.eventListenerServiceName" . }}
                port:
                  number: 8080
  {{- if .Values.triggers.github.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.triggers.github.ingress.hostname }}
      {{- with .Values.triggers.github.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
{{- end }}
