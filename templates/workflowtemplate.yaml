apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: {{ include "static-site.workflowTemplateName" . }}
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
spec:
  entrypoint: pipeline
  onExit: cleanup
  serviceAccountName: {{ include "static-site.workflowServiceAccountName" . }}
  arguments:
    parameters:
      - name: revision
        value: {{ .Values.site.revision | quote }}
  synchronization:
    mutexes:
      - name: {{ default (printf "%s-publish" ((include "static-site.fullname" .) | trunc 55 | trimSuffix "-")) .Values.workflow.mutexName | quote }}
  securityContext:
    {{- toYaml .Values.workflow.podSecurityContext | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.workflow.ttlStrategy }}
  ttlStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.workflow.podGC }}
  podGC:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.workflow.nodeSelector }}
  nodeSelector:
    {{- toYaml .Values.workflow.nodeSelector | nindent 4 }}
  {{- else }}
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- if .Values.workflow.affinity }}
  affinity:
    {{- toYaml .Values.workflow.affinity | nindent 4 }}
  {{- else }}
  {{- with .Values.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- if .Values.workflow.tolerations }}
  tolerations:
    {{- toYaml .Values.workflow.tolerations | nindent 4 }}
  {{- else }}
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  volumes:
    - name: site
      persistentVolumeClaim:
        claimName: {{ include "static-site.pvcName" . }}
  templates:
    - name: pipeline
      dag:
        tasks:
        {{- if .Values.build }}
        {{- range $index, $stage := .Values.build }}
          - name: build-{{ $index }}
            template: build-{{ $index }}
        {{- end }}
          - name: publish
            dependencies:
            {{- range $index, $_ := .Values.build }}
              - build-{{ $index }}
            {{- end }}
            template: publish
        {{- else }}
          - name: copy-source
            template: copy-source
          - name: publish
            dependencies:
              - copy-source
            template: publish
        {{- end }}

    {{- range $index, $stage := .Values.build }}
    - name: build-{{ $index }}
      inputs:
        artifacts:
          - name: source
            path: /workspace/source
            git:
              repo: {{ $.Values.site.repository | quote }}
              revision: {{ "{{workflow.parameters.revision}}" | quote }}
              depth: {{ $.Values.workflow.git.depth }}
              disableSubmodules: {{ $.Values.workflow.git.disableSubmodules }}
              insecureIgnoreHostKey: {{ $.Values.workflow.git.insecureIgnoreHostKey }}
              sshPrivateKeySecret:
                name: {{ include "static-site.gitSecretName" $ }}
                key: {{ $.Values.gitCredentials.privateKeyKey }}
      container:
        image: "{{ $stage.image.repository }}:{{ $stage.image.tag }}"
        imagePullPolicy: {{ $stage.image.pullPolicy }}
        command:
          - /bin/sh
          - -ec
        args:
          - |
            set -eu
            stage_name={{ $stage.name | quote }}
            working_directory={{ $stage.workingDirectory | quote }}
            output_directory={{ $stage.outputDirectory | quote }}
            for relative_path in "$working_directory" "$output_directory"; do
              case "$relative_path" in
                ""|/*|..|*/..|../*|*/../*) echo "invalid path in build stage $stage_name: $relative_path" >&2; exit 1 ;;
              esac
            done
            cd "/workspace/source/$working_directory"
            /bin/sh -ec {{ $stage.command | quote }}
            output_path="/workspace/source/$working_directory/$output_directory"
            test -d "$output_path"
            target={{ printf "/site/.staging/{{workflow.uid}}/stage-%d" $index | quote }}
            rm -rf "$target"
            mkdir -p "$target"
            cp -R "$output_path/." "$target/"
        volumeMounts:
          - name: site
            mountPath: /site
        {{- with $stage.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $stage.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
    {{- end }}

    {{- if not .Values.build }}
    - name: copy-source
      inputs:
        artifacts:
          - name: source
            path: /workspace/source
            git:
              repo: {{ .Values.site.repository | quote }}
              revision: {{ "{{workflow.parameters.revision}}" | quote }}
              depth: {{ .Values.workflow.git.depth }}
              disableSubmodules: {{ .Values.workflow.git.disableSubmodules }}
              insecureIgnoreHostKey: {{ .Values.workflow.git.insecureIgnoreHostKey }}
              sshPrivateKeySecret:
                name: {{ include "static-site.gitSecretName" . }}
                key: {{ .Values.gitCredentials.privateKeyKey }}
      container:
        image: "{{ .Values.workflow.publishImage.repository }}:{{ .Values.workflow.publishImage.tag }}"
        imagePullPolicy: {{ .Values.workflow.publishImage.pullPolicy }}
        command:
          - /bin/sh
          - -ec
        args:
          - |
            target={{ "/site/.staging/{{workflow.uid}}/stage-0" | quote }}
            rm -rf "$target"
            mkdir -p "$target"
            cp -R /workspace/source/. "$target/"
            rm -rf "$target/.git"
        volumeMounts:
          - name: site
            mountPath: /site
    {{- end }}

    - name: publish
      container:
        image: "{{ .Values.workflow.publishImage.repository }}:{{ .Values.workflow.publishImage.tag }}"
        imagePullPolicy: {{ .Values.workflow.publishImage.pullPolicy }}
        command:
          - /bin/sh
          - -ec
        args:
          - |
            set -eu
            release_id={{ "{{workflow.uid}}" | quote }}
            revision={{ "{{workflow.parameters.revision}}" | quote }}
            staging_root="/site/.staging/$release_id"
            release_tmp="/site/.release-$release_id"
            release_dir="/site/releases/$release_id"
            next_link="/site/.current-$release_id"
            current="$(readlink /site/current 2>/dev/null || true)"
            previous_release="${current#releases/}"

            rm -rf "$release_tmp" "$release_dir"
            mkdir -p "$release_tmp" /site/releases
            {{- if .Values.build }}
            {{- range $index, $stage := .Values.build }}
            publish_path={{ $stage.path | quote }}
            case "$publish_path" in
              ""|/*|..|*/..|../*|*/../*) echo "invalid publish path: $publish_path" >&2; exit 1 ;;
            esac
            mkdir -p "$release_tmp/$publish_path"
            cp -R {{ printf "/site/.staging/{{workflow.uid}}/stage-%d/." $index | quote }} "$release_tmp/$publish_path/"
            {{- end }}
            {{- else }}
            cp -R "/site/.staging/$release_id/stage-0/." "$release_tmp/"
            {{- end }}

            mv "$release_tmp" "$release_dir"
            printf '%s\n' "$revision" > "/site/.revision-$release_id"
            ln -s "releases/$release_id" "$next_link"
            mv -Tf "$next_link" /site/current
            rm -rf "$staging_root"

            find /site/releases -mindepth 1 -maxdepth 1 \
              ! -name "$release_id" ! -name "$previous_release" \
              -exec rm -rf {} +
            find /site -maxdepth 1 -type f -name '.revision-*' \
              ! -name ".revision-$release_id" ! -name ".revision-$previous_release" \
              -delete
            echo "published revision $revision as release $release_id"
        volumeMounts:
          - name: site
            mountPath: /site

    - name: cleanup
      container:
        image: "{{ .Values.workflow.publishImage.repository }}:{{ .Values.workflow.publishImage.tag }}"
        imagePullPolicy: {{ .Values.workflow.publishImage.pullPolicy }}
        command:
          - /bin/sh
          - -ec
        args:
          - |
            release_id={{ "{{workflow.uid}}" | quote }}
            rm -rf "/site/.staging/$release_id" "/site/.release-$release_id"
            rm -f "/site/.current-$release_id"
        volumeMounts:
          - name: site
            mountPath: /site
