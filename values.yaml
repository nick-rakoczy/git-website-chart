replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: nginx
  tag: alpine
  pullPolicy: IfNotPresent

imagePullSecrets: []

site:
  repository: ""
  revision: main
  indexFile: index.html

# Build containers run sequentially after the repository is cloned. An empty
# list publishes the repository contents without a build step.
build: []
# - name: main
#   image:
#     repository: node
#     tag: 22-alpine
#     pullPolicy: IfNotPresent
#   workingDirectory: .
#   command: npm ci && npm run build
#   outputDirectory: dist
#   path: .

git:
  image:
    repository: registry.k8s.io/git-sync/git-sync
    tag: v4.7.0
    pullPolicy: IfNotPresent
  depth: 1
  disableSubmodules: true
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

publishImage:
  repository: alpine
  tag: "3.22"
  pullPolicy: IfNotPresent

gitCredentials:
  # Authentication mode: "ssh" or "githubApp".
  authentication: ssh
  # Name of an existing Secret. Required when onePassword.enabled is false and
  # ignored when the chart provisions its own <Helm release name>-git Secret.
  secretName: ""
  # 1Password SSH Key items expose "private key" as "private-key".
  privateKeyKey: private-key
  knownHostsKey: known-hosts
  githubApp:
    # Secret keys populated from the corresponding 1Password item fields.
    applicationIdKey: application_id
    installationIdKey: installation_id
    privateKeyKey: private_key
  onePassword:
    # Create a OnePasswordItem named <Helm release name>-git.
    enabled: false
    itemPath: ""
    annotations: {}

nginx:
  port: 8080
  cacheControl: "public, max-age=300"
  extraConfig: ""
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    # The official nginx Alpine image uses UID/GID 101. Running the master as
    # that user avoids requiring CHOWN for temporary directories.
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101

podSecurityContext:
  fsGroup: 101
  fsGroupChangePolicy: OnRootMismatch

automountServiceAccountToken: false

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  # Leave empty to use the cluster's default IngressClass.
  className: ""
  annotations: {}
  hostname: ""
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: ""

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
