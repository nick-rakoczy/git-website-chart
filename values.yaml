replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: nginx
  tag: alpine
  pullPolicy: IfNotPresent

imagePullSecrets: []

site:
  repository: ""
  revision: main
  indexFile: index.html

gitSync:
  image:
    repository: registry.k8s.io/git-sync/git-sync
    tag: v4.7.0
    pullPolicy: IfNotPresent
  period: 30s
  depth: 1
  maxFailures: -1
  root: /git
  link: current
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

gitCredentials:
  # Authentication mode: "ssh" or "githubApp".
  authentication: ssh
  # Name of an existing Secret populated by the 1Password Operator.
  # Defaults to <release fullname>-git when empty.
  secretName: ""
  # 1Password SSH Key items expose "private key" as "private-key".
  privateKeyKey: private-key
  knownHostsKey: known-hosts
  githubApp:
    # Secret keys populated from the corresponding 1Password item fields.
    applicationIdKey: application_id
    installationIdKey: installation_id
    privateKeyKey: private_key
  onePassword:
    # Create a OnePasswordItem which provisions the Secret used by this chart.
    enabled: false
    itemPath: ""
    annotations: {}

nginx:
  port: 8080
  cacheControl: "public, max-age=300"
  extraConfig: ""
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    # The official nginx Alpine image uses UID/GID 101. Running the master as
    # that user avoids requiring CHOWN for temporary directories.
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101

podSecurityContext:
  fsGroup: 101
  fsGroupChangePolicy: OnRootMismatch

automountServiceAccountToken: false

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  # Leave empty to use the cluster's default IngressClass.
  className: ""
  annotations: {}
  hostname: ""
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: ""

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
