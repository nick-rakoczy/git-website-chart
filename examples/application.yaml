apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-com
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/web-infrastructure.git
    targetRevision: main
    path: static-site-chart
    helm:
      valueFiles:
        - examples/example.com.values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: example-com
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

