site:
  repository: https://github.com/your-org/example.com.git
  revision: main

build:
  - name: main
    image:
      repository: node
      tag: 22-alpine
      pullPolicy: IfNotPresent
    workingDirectory: .
    command: npm ci && npm run build
    outputDirectory: dist
    path: .

gitCredentials:
  authentication: githubApp
  secretName: example-com-git
  onePassword:
    enabled: true
    itemPath: vaults/Kubernetes/items/example-com-git

ingress:
  hostname: example.com
  tls:
    # Leave empty when Traefik obtains TLS without a per-Ingress Secret.
    secretName: example-com-tls
